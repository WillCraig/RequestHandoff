# Builds, signs, and optionally publishes RequestHandoff.
# Pull requests do not run this workflow, so CI stays green without Marketplace secrets.
# workflow_dispatch builds and signs. Set publish to true, or push a v*.*.* tag, to upload.
# The first Marketplace upload is manual. publishPlugin uploads later versions only.
# Required GitHub Actions secrets (Will adds these; values are never printed):
#   JETBRAINS_MARKETPLACE_TOKEN
#   CERTIFICATE_CHAIN
#   PRIVATE_KEY
#   PRIVATE_KEY_PASSWORD
# See the README Publish section and
# https://plugins.jetbrains.com/docs/intellij/plugin-signing.html
# https://plugins.jetbrains.com/docs/intellij/publishing-plugin.html

name: Publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to JetBrains Marketplace. Leave false to build and sign only.
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build, sign, and maybe publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch sources
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the plugin
        run: ./gradlew buildPlugin --stacktrace

      - name: Sign the plugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${CERTIFICATE_CHAIN}" ] || missing+=(CERTIFICATE_CHAIN)
          [ -n "${PRIVATE_KEY}" ] || missing+=(PRIVATE_KEY)
          [ -n "${PRIVATE_KEY_PASSWORD}" ] || missing+=(PRIVATE_KEY_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing GitHub Actions secrets: ${missing[*]}."
            echo "Add them on WillCraig/RequestHandoff. Values are not printed. See the README Publish section."
            exit 1
          fi
          ./gradlew signPlugin --stacktrace

      - name: Upload the signed plugin
        uses: actions/upload-artifact@v4
        with:
          name: RequestHandoff-signed
          if-no-files-found: error
          path: build/distributions/*-signed.zip

      - name: Publish the plugin
        if: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${JETBRAINS_MARKETPLACE_TOKEN}" ] || missing+=(JETBRAINS_MARKETPLACE_TOKEN)
          [ -n "${CERTIFICATE_CHAIN}" ] || missing+=(CERTIFICATE_CHAIN)
          [ -n "${PRIVATE_KEY}" ] || missing+=(PRIVATE_KEY)
          [ -n "${PRIVATE_KEY_PASSWORD}" ] || missing+=(PRIVATE_KEY_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing GitHub Actions secrets: ${missing[*]}."
            echo "Add them on WillCraig/RequestHandoff. Values are not printed. See the README Publish section."
            exit 1
          fi
          ./gradlew publishPlugin --stacktrace
